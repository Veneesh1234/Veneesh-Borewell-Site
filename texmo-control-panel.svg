<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Panel background -->
  <rect width="300" height="300" fill="#f5f5f5"/>
  
  <!-- Main panel body -->
  <rect x="30" y="20" width="240" height="260" fill="#34495e" rx="10"/>
  
  <!-- Panel border -->
  <rect x="30" y="20" width="240" height="260" fill="none" stroke="#1a252f" stroke-width="2" rx="10"/>
  
  <!-- Title area -->
  <rect x="30" y="20" width="240" height="50" fill="#43a047" rx="10"/>
  <text x="150" y="55" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">TEXMO Control Panel</text>
  
  <!-- Analog Meter -->
  <circle cx="100" cy="140" r="45" fill="#555" stroke="#888" stroke-width="2"/>
  <text x="100" y="145" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Voltage</text>
  <line x1="100" y1="140" x2="120" y2="120" stroke="#ff9800" stroke-width="3"/>
  <circle cx="100" cy="140" r="4" fill="#ff9800"/>
  
  <!-- Selector Switches -->
  <g>
    <rect x="170" y="110" width="80" height="70" fill="#444" stroke="#888" stroke-width="1" rx="5"/>
    <text x="210" y="130" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Selectors</text>
    <circle cx="190" cy="155" r="6" fill="#ffd700" stroke="#888"/>
    <circle cx="210" cy="155" r="6" fill="#888" stroke="#666"/>
    <circle cx="230" cy="155" r="6" fill="#888" stroke="#666"/>
  </g>
  
  <!-- Terminal Blocks -->
  <g>
    <text x="80" y="220" font-family="Arial" font-size="11" fill="white">Terminal Blocks</text>
    <rect x="60" y="230" width="60" height="20" fill="#666" stroke="#999" stroke-width="1" rx="2"/>
    <circle cx="75" cy="240" r="3" fill="#ffd700"/>
    <circle cx="90" cy="240" r="3" fill="#ffd700"/>
    <circle cx="105" cy="240" r="3" fill="#ffd700"/>
  </g>
  
  <!-- Features list -->
  <text x="170" y="220" font-family="Arial" font-size="11" fill="#ccc">✓ Analog Meter</text>
  <text x="170" y="235" font-family="Arial" font-size="11" fill="#ccc">✓ Robust Design</text>
  <text x="170" y="250" font-family="Arial" font-size="11" fill="#ccc">✓ Durable Switches</text>
</svg>